[project]
name = "sourcelens"
version = "0.1.0"
description = "Token-efficient local code retrieval MCP server — index a codebase once with tree-sitter, query exact symbols instead of re-reading files."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Mills" }]
dependencies = [
    "mcp>=2.0",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sourcelens = "sourcelens.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sourcelens*"]
